name: CI Linting Check

on:
  pull_request:
    branches:
      - develop
  push:
    branches:
      - develop

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: npm install -g htmlhint stylelint

      - name: Lint HTML files
        run: htmlhint "**/*.html"

      - name: Lint CSS files
        run: stylelint "**/*.css"